<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 -800 1214 410" width="600" height="203"><style>.prop{animation:spin .12s linear infinite;transform-box:view-box}.p1{animation-duration:.11s}
.blur{animation:flick .18s steps(2) infinite}.pb{animation:flick .2s steps(2) infinite}
.led{animation:blink 1s steps(2) infinite}.led2{animation:blink 1s steps(2) infinite;animation-delay:-.5s}
@keyframes spin{0%{transform:scaleX(1)}25%{transform:scaleX(.15)}50%{transform:scaleX(-1)}75%{transform:scaleX(.15)}100%{transform:scaleX(1)}}
@keyframes flick{0%{opacity:.25}100%{opacity:.6}}@keyframes blink{0%{opacity:1}100%{opacity:.25}}
